spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  application:
    name: Expense Diary
  datasource:
    url: jdbc:postgresql://localhost:5432/<db_name>
    username: <db_username>
    password: <db_username_password>
    devtools:
      restart:
        enabled: false

jwt:
  secret: <Random JWT secret>

frontend:
  url: http://localhost:5173

logging:
  level:
    root: INFO
    org.springframework.security: INFO

server:
  port: 8085

secure-cookie-pref: false